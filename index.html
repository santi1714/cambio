<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Evento con Botón</title>

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <h1>cambio de color</h1>
        <p id="mensaje">Haz clic en el botón para cambiar el color de fondo.</p>

        <!-- Botón que ejecuta el evento -->
        <button id="btnCambiarColor">Cambiar Color</button>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
